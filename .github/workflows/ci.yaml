name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d notes"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: notes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check linting
        working-directory: notes-backend
        run: ruff check .

      - name: Check formatting
        working-directory: notes-backend
        run: ruff format --check .
        
      - name: Run tests
        working-directory: notes-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notes
          JWT_SECRET_KEY: this-is-a-long-test-secret-key-for-ci-2026
        run: python -m pytest